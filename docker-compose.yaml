services:
  kafka:
    image: confluentinc/cp-kafka:7.8.3
    container_name: kafka
    ports:
      - "9092:9092"
    environment:
      KAFKA_KRAFT_MODE: 'true'
      CLUSTER_ID: '1L6g7nGhU-eAKfL--X25wo'
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@kafka:9093
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_LISTENERS: PLAINTEXT://0.0.0.0:9092,CONTROLLER://0.0.0.0:9093
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka:9092
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_LOG_DIRS: /tmp/kraft-combined-logs
    volumes:
      - kafka_kraft:/var/lib/kafka/data


  mongodb:
    image: mongo:7
    container_name: mongodb
    restart: always
    ports:
      - "27017:27017"
    environment:
      MONGO_INITDB_ROOT_USERNAME: root
      MONGO_INITDB_ROOT_PASSWORD: root123
    volumes:
      - mongo_data:/data/db


  elasticsearch:
    image: elasticsearch:8.12.0
    container_name: elasticsearch
    ports:
      - "9200:9200"
    environment:
    - xpack.security.enabled=false
    - discovery.type=single-node

  kibana:
    image: docker.elastic.co/kibana/kibana:8.12.0
    container_name: kibana
    ports:
      - "5601:5601"
    environment:
      ELASTICSEARCH_HOSTS: http://elasticsearch:9200
    depends_on:
      - elasticsearch
  
    
  send_metadata:
    build: ./send_metadata
    container_name: send_metadata
    environment:
      KAFKA_URI: "kafka:9092"
      KAFKA_TOPIC: "metadata_topic"
      FOLDER_PATH: "/app/podcasts"
      ES_HOST: "http://elasticsearch:9200"
      LOG_INDEX: "logs_project_muazin"
      LOGGER_NAME: "muazin_service_prod"
    volumes:
      - ../podcasts:/app/podcasts
    depends_on:
      - kafka
      - elasticsearch

  consumption_and_processing:
    build: ./consumption_and_processing
    container_name: consumption_and_processing
    environment:
      KAFKA_URI: "kafka:9092"
      KAFKA_TOPIC: "metadata_topic"
      MONGO_URI: "mongodb://root:root123@mongodb:27017/muezzin_db?authSource=admin"
      ELASTIC_URI: "http://elasticsearch:9200"
      INDEX_NAME: "podcasts_metadata"
      LOGGER_NAME: "muazin_service_prod"
      LOG_INDEX: "logs_project_muazin"
      ES_HOST: "http://elasticsearch:9200"
    volumes:
      - ../podcasts:/app/podcasts 
    depends_on:
      - kafka
      - mongodb
      - elasticsearch

  threat_level:
    build: ./threat_level
    container_name: threat_level
    environment:
      ELASTIC_URI: "http://elasticsearch:9200"
      INDEX_NAME: "podcasts_metadata"
      LOGGER_NAME: "threat_level_service"
      LOG_INDEX: "logs_project_muazin"
      HOSTILE_LIST_ENCODED: "RnJlZWRvbSBGbG90aWxsYSxSZXNpc3RhbmNlLExpYmVyYXRpb24sRnJlZSBQYWxlc3RpbmUsR2F6YSxDZWFzZWZpcmUsUHJvdGVzdCxVTlJXQQ=="
      VERY_HOSTILE_LIST_ENCODED: "R2Vub2NpZGUsV2FyIENyaW1lcyxBcGFydGhlaWQsTWFzc2FjcmUsTmFrYmEsRGlzcGxhY2VtZW50LEh1bWFuaXRhcmlhbiBDcmlzaXMsQmxvY2thZGUsT2NjdXBhdGlvbixSZWZ1Z2VlcyxJQ0MsQkRT"
    depends_on:
      - elasticsearch

  smart_questions:
    build: ./smart_questions
    container_name: smart_questions
    ports:
      - "8000:8000"
    environment:
      ELASTIC_URI: "http://elasticsearch:9200"
      INDEX_NAME: "podcasts_metadata"
      LOGGER_NAME: "smart_questions_api"
      LOG_INDEX: "logs_project_muazin"
      ES_HOST: "http://elasticsearch:9200"
    depends_on:
      - elasticsearch


volumes:
  mongo_data:
  kafka_kraft: